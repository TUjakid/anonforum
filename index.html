<!doctype html>
<html lang="ru" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <div class="theme-switch" role="group" aria-label="Тема">
    <button type="button" class="theme-dot graphite" data-theme-set="graphite" title="Graphite" aria-label="Graphite"></button>
    <button type="button" class="theme-dot paper"    data-theme-set="paper"    title="Paper"    aria-label="Paper"></button>
    <button type="button" class="theme-dot night"    data-theme-set="night"    title="Night"    aria-label="Night"></button>
  </div>

  <noscript>Включите JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
